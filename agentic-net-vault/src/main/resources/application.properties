# AgenticNet Vault Application Configuration
# Port 8085 (node=8080, master=8082, gateway=8083, executor=8084, vault=8085)
server.port=8085

# --- Connection/thread ceilings: the vault must not be killable by a misbehaving client ---
#
# Defaults are threads.max=200 and max-connections=8192, which is far more than a credential CRUD
# service ever needs and far more than its 1 GiB container can hold. A master bug once fanned out
# ~394 simultaneous credential reads (one per transition per poll cycle, on an unbounded reactive
# flatMap); Tomcat obligingly spawned a worker per connection, reached 227 live threads, and the
# resulting native RSS drove the process into the container limit and restart pressure.
# The JVM only ever reported ~130 MiB of Java memory, so nothing in the heap metrics showed it.
#
# The client-side bug is fixed, but a service should not depend on its callers behaving. Legitimate
# concurrent credential demand is single-digit (execution-time reads are bounded/coalesced, plus
# health probes), so these ceilings sit roughly an order of magnitude above real load and an order of
# magnitude below what killed it. Excess connections queue in the accept backlog and are then
# refused. Master keeps pure/status lanes independent of the vault and fails credential-dependent
# execution closed, so a refusal is visible and contained rather than silently dropping secrets.
#
# Sizing was measured, not guessed. Adversarial test at 600 concurrent connections (50% more than
# the 394 that killed it): with threads.max=50 the service SURVIVED, but per-thread native cost is
# not returned when workers are reaped, so resting anon memory ratcheted 775 -> 993 -> 995 MiB
# across three storms — 97% of the cap, alive but with no headroom left. 25 keeps the worst case
# well clear while still leaving ~1.7x over real demand (master's fan-out is bounded at 8).
#
# Override per deployment with the standard Spring env names (SERVER_TOMCAT_THREADS_MAX etc.).
server.tomcat.threads.max=25
server.tomcat.threads.min-spare=5
server.tomcat.max-connections=100
server.tomcat.accept-count=50

# Environment configuration import
spring.config.import=optional:file:.env[.properties]

debug=false
spring.main.log-startup-info=false
logging.level.org.springframework.boot.autoconfigure=INFO
logging.level.org.springframework.boot.autoconfigure.logging=OFF
logging.level.org.springframework.boot.context.logging=OFF

# Application info
spring.application.name=agentic-net-vault
info.app.name=AgenticNet Vault Service
info.app.description=Secrets management service for AgetnticOS transition credentials (OpenBao backend)
info.app.version=0.0.1-SNAPSHOT
agenticos.cors.allowed-origin-patterns=${AGENTICOS_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}

# Actuator endpoints
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.metrics.export.prometheus.enabled=true

# OpenTelemetry configuration
otel.service.name=agentic-net-vault
otel.resource.attributes=service.name=agentic-net-vault,service.version=0.0.1-SNAPSHOT
otel.exporter.otlp.endpoint=http://localhost:4318
otel.traces.exporter=none
otel.metrics.exporter=none
otel.logs.exporter=none

# =============================================================================
# OPENBAO CONFIGURATION
# =============================================================================
# OpenBao server URL (Vault-compatible API)
vault.openbao-url=${VAULT_OPENBAO_URL:http://localhost:8200}
# Authentication token (must be set via VAULT_OPENBAO_TOKEN env var or AppRole)
vault.openbao-token=${VAULT_OPENBAO_TOKEN:}
# KV v2 secrets engine mount path
vault.kv-mount=secret
# Base path within KV engine for credentials
vault.credentials-path=agenticos/credentials

# AppRole auth (production) — when set, token auth is ignored
vault.approle.role-id=${VAULT_APPROLE_ROLE_ID:}
vault.approle.secret-id=${VAULT_APPROLE_SECRET_ID:}

# =============================================================================
# LOGGING
# =============================================================================
# Appenders (console + rolling file) come from logback-spring.xml — the standard
# AgenticNetOS template. Rollover defaults: 50MB / 7 days / 500MB total cap;
# override via logging.logback.rollingpolicy.* here if needed. File lands at
# ${LOG_PATH:-/tmp}/agentic-net-vault.log.
logging.level.com.sailer.agenticos.agenticnetvault=INFO
logging.level.org.springframework.vault=WARN

# Error handling
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false
