# Loki — centralized log aggregation for AgenticNetOS (single binary, filesystem storage).
#
# HARD CAPS FROM DAY ONE (lesson from the 2026-07 tempo ingest-overload incident:
# an uncapped ingest backend spiraled to 847% CPU / hundreds of GB on staging):
#   - retention_period 72h, enforced by the compactor
#   - ingestion rate-limited to 5 MB/s (burst 10 MB)
# Raise these deliberately, never by accident.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: "2026-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 72h
  ingestion_rate_mb: 5
  ingestion_burst_size_mb: 10
  per_stream_rate_limit: 5MB
  per_stream_rate_limit_burst: 10MB
  max_streams_per_user: 5000
  reject_old_samples: true
  reject_old_samples_max_age: 24h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
