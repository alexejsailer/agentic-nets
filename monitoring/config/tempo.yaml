server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal

# Bound on-disk trace growth. Without a compactor the local backend keeps every
# block forever and the Docker VM disk fills (this was the Jenkins build-node
# OFFLINE / tempo-data 48GB incident). Retain ~48h of traces for dev/staging.
compactor:
  compaction:
    block_retention: 48h
    compacted_block_retention: 1h

usage_report:
  reporting_enabled: false
