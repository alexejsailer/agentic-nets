services:
  tempo:
    image: ${TEMPO_IMAGE:-grafana/tempo:2.10.4}
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./config/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"   # Tempo HTTP API

  otel-collector:
    image: ${OTEL_COLLECTOR_IMAGE:-otel/opentelemetry-collector-contrib:0.135.0}
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./config/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    depends_on: [tempo]
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.11.2}
    command: ["--config.file=/etc/prometheus/prometheus.yaml"]
    volumes:
      - ./config/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ./alerts:/etc/prometheus/alerts:ro
    depends_on: [otel-collector]
    ports:
      - "9090:9090"

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:13.0.1}
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana-provisioning:/etc/grafana/provisioning
    depends_on: [prometheus, tempo, loki]
    ports:
      - "3000:3000"

  # Loki — centralized log storage (query via Grafana Explore, datasource "Loki").
  # Retention + ingestion are HARD-CAPPED in loki.yaml (72h / 5MB/s).
  loki:
    image: ${LOKI_IMAGE:-grafana/loki:3.7.3}
    command: ["-config.file=/etc/loki.yaml"]
    volumes:
      - ./config/loki.yaml:/etc/loki.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"

  # Alloy — scrapes every container's stdout/stderr via the Docker API and
  # pushes to Loki. Needs the docker socket read-only; no app changes required.
  alloy:
    image: ${ALLOY_IMAGE:-grafana/alloy:v1.17.1}
    command: ["run", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    volumes:
      - ./config/alloy-config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on: [loki]

volumes:
  tempo-data:
  loki-data:
  alloy-data:
