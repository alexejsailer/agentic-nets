apiVersion: agentic-nets.com/capability/v1
name: web-investigator
version: 1.12.0
displayName: Web Investigator
domain: research
description: >-
  Point it at seed URLs and a brief; it crawls, dates, scores, categorises and analyses.
  Deterministic scripts on the executor do the fetching, date extraction, relevance scoring,
  dedupe, link discovery and every count; ONE narrow agent lane classifies each surviving
  article and one more writes the analysis. The split is the point: the agent decides, the
  pipeline measures, so no figure in the output is model-authored. It also indexes YOUR OWN
  site's sitemap into a separate place and subtracts it, so the gaps it reports are the ones
  you have not already covered — without your pages ever entering the crawled corpus.
tags: [agents, capability-pack, research, crawler, competitive-analysis]
# fanOut emits, postset retain, and ${json()} are 2.57.0 engine features — installing
# against an older master leaves the lift lane unable to fan links out or trim telemetry.
engineMin: "2.57.0"

entry:
  inbox: p-scout-brief
  outbox: p-scout-digest
  correlationField: briefId
  statuses: [landscape-analysis]
  taskFields:
    required: [briefId, topic, description, categories, mustInclude]
    optional: [domainHint, mustExclude, denyHosts, allowHosts, minScore, maxDepth, brandNewDays, recentDays, sameHostOnly, searchProvider, ownSitemap]
  resultFields: [ownedAngles, freshness, freshSignal, gaps, ownPosition, recommendations, totalFindings, freshTextArticles, ownArticles, ownUncovered]

nets:
  - name: scout
    pnml: nets/scout.pnml.json
    inscriptions: nets/scout.inscriptions.json
    role: front-door

# Command lanes invoke these by reference (args.toolId); the installer registers them into the
# target model's LOCAL catalog before wiring the nets, because a toolId resolves per-model.
scripts:
  - id: scout-fetch
    runtime: python3
    file: assets/scout-fetch.py
    description: >-
      Fetch one URL with conditional GET, extract title/text/links, detect the publication date
      (meta, ld+json, time tag, URL path), score relevance as topic fit x PAGE SHAPE (prose
      ratio, length) so a spec sheet that merely uses the right words no longer passes, type
      fragment-heavy pages as `catalog` for a free rejection, classify listing-vs-article and
      source type, store full text in the blobstore, keep the article's opening as the extract,
      classify failures, and queue newly discovered URLs (deduped, depth-capped,
      injection-guarded). Honours the dashboard's per-host policy (p-scout-source-policy):
      `ignore` skips the fetch and pins the URL in the registry, `index-only` fetches for links
      but never lets the page reach the classifier.
  - id: scout-recrawl
    runtime: python3
    file: assets/scout-recrawl.py
    description: >-
      Keep the investigation watching: weekly (and on demand) re-queue every known source
      host's entry pages into the frontier. Unchanged pages cost a 304; only genuinely new
      links survive dedupe, so recency and growth numbers keep moving. Hosts a human set to
      index-only or ignore are left alone.
  - id: scout-search
    runtime: python3
    file: assets/scout-search.py
    description: >-
      Widen the crawl beyond link-following by querying a search API (brave | tavily | serper,
      whichever key is present). Hits enter the frontier at depth 0 through the same dedupe,
      host filters and injection guard as discovered links.
  - id: scout-sitemap
    runtime: python3
    file: assets/scout-sitemap.py
    description: >-
      Onboard a website by harvesting its own index of itself: discover the sitemap via
      robots.txt (then conventional locations), walk index files down to the article lists,
      filter obvious non-articles, dedupe against everything already fetched or queued, and
      feed the rest to the frontier. Hosts come from onboarding requests
      (p-scout-source-requests, consumed after processing), host profiles, and finding hosts;
      denyHosts and the per-host policy log are honoured (index-only and ignore hosts are not
      harvested: harvesting exists to find pages to classify). Free and key-less;
      URLS_PER_HOST / MAX_TOTAL bound each run and the registry makes repeat runs incremental,
      so a large backlog drains over the monthly schedule instead of in one burst.
  - id: scout-owned
    runtime: python3
    file: assets/scout-owned.py
    description: >-
      Index the OWNER's own published articles from their sitemap — urls and lastmod only, never
      page bodies — into p-scout-owned. Writes to that one place, so owned content can never
      reach the findings corpus; keep the same host in brief.denyHosts to block the crawl side.
  - id: scout-taxonomy
    runtime: python3
    file: assets/scout-taxonomy.py
    description: >-
      Roll findings into per-category and per-source counts and explicit coverage gaps; hand the
      analyst every fresh finding as a compact card (the summary and key points written at
      classification time) and only the newest few as clipped body text; and join against
      p-scout-owned to report ownCovered/ownUncovered per category plus trueGaps — competitor
      material with no owner equivalent. Filler terms are derived from the corpus, not listed,
      so the matching carries no domain. When the retry lane re-issues a run after the analysis
      answered without DONE, the facts token is withheld once three such fallbacks were filed
      today, so a model that ignores the contract cannot burn all night.
  - id: scout-write
    runtime: python3
    file: assets/scout-write.py
    description: >-
      The staff writer: draft ONE accepted article task per run, end to end, from a KNOWLEDGE
      PACK ranked across the whole corpus — the competitor piece to beat, the best-matching
      passages of the next few sources pulled from their blobs, and cards for the wider field,
      no host dominating — stored as its own blob so what the writer saw is auditable. Then the
      LOCAL claude binary headlessly (-p, no tools, no session persistence); the article goes to
      the blobstore and the draft token carries only preview, outline, counts and blob urns.
      Dedupe by drafts ledger; the task token is never consumed — it belongs to the application
      lifecycle (accepted -> done). Requires Claude Code on the executor host; the stopped
      t-scout-write agent lane is the API fallback.
  - id: scout-write-fable
    runtime: python3
    file: assets/scout-write.py
    description: >-
      The same knowledge-pack writer bound to a HUMAN CHOICE rather than a schedule: the
      dashboard's per-task button passes TASK_ID and WRITER_MODEL, so a specific assignment gets
      drafted by a specific model (the pack ships the button wired to `fable`). Always writes —
      asking for a second draft is the point — and files it as a new revision beside the
      existing one, with the article itself in the blobstore, so two writers can be compared on
      one brief. Nothing schedules this lane; it fires only when a person presses the button.
  - id: scout-health
    runtime: python3
    file: assets/scout-health.py
    description: Roll fetch telemetry into diagnostics with concrete tuning suggestions.
  - id: scout-usage
    runtime: python3
    file: assets/scout-usage.py
    description: >-
      Put the cost where the decisions are made: read master's measured per-transition usage
      for the last 24 hours and file ONE compact usage-day token (totals, fires, per-lane
      breakdown with tier and group) into p-scout-usage, keeping 30 days. Nightly by cron and
      on demand from the dashboard's Refresh cost.

config:
  - key: p-scout-brief
    seed: seeds/p-scout-brief.json
    description: >-
      The investigation definition — topic, description, domainHint, the category list the
      classifier must choose from, scoring terms, host allow/deny lists, depth and recency
      windows, and ownSitemap. Ships as a REPLACE-ME template on purpose: the pack carries no domain.
  - key: p-scout-owned
    description: >-
      Derived, not seeded: scout-owned rebuilds it from brief.ownSitemap (weekly by default).
      Holds slugs only. Leave it empty and the digest still runs — it simply cannot tell you
      which gaps you have already filled.

credentials:
  - key: SEARCH_API_KEY
    transition: t-scout-search
    required: false
    description: >-
      Search API key for the OPTIONAL widening lane. Without it the net still works on seeds
      plus link-following; the search lane fails loudly rather than looking like a search that
      found nothing. Set with set_transition_credentials — never in a token, since places are
      event-sourced. Provider is chosen by brief.searchProvider (brave | tavily | serper).

tiers:
  - transition: t-scout-categorize
    tier: worker    # per-article classification; profiled to research-worker
  - transition: t-scout-digest
    tier: high      # one synthesis pass over measured facts

install:
  targetModelDefault: net-lab
  sessionId: agent-web-investigator

verify: verify/smoke.json
