name: Starter task
description: Maintainer template for a scoped first contribution.
title: "[good first issue] "
labels: ["good first issue", "help wanted"]
body:
  - type: textarea
    id: why
    attributes:
      label: Why this is a good first issue
      description: Explain why the scope is small and approachable.
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: Task
      description: What needs to be changed, concretely?
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Where to look
      description: List files, directories, docs, and related tests.
      placeholder: |
        Files:
        Tests:
        Docs:
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Acceptance criteria for the contributor.
      placeholder: |
        - [ ]
        - [ ]
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context for new contributors
      description: Links to README sections, architecture notes, examples, or prior issues.
