# Maintenance convention: routine bumps are applied directly on main (all test
# suites must be green), so open dependabot PRs auto-close on the next check
# rather than being merged one by one. Editing THIS file triggers an immediate
# dependabot run for every ecosystem below — useful to reconcile stale PRs
# right after a batch of direct bumps lands on main.
version: 2
updates:
  # Java services — Maven
  - package-ecosystem: maven
    directory: /agentic-net-gateway
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Spring Boot 4 / Framework 7 is a deliberate migration, not a routine bump —
      # we track the supported 3.5.x patch line until that migration is scheduled.
      - dependency-name: "org.springframework.boot:*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: maven
    directory: /agentic-net-executor
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Spring Boot 4 / Framework 7 is a deliberate migration, not a routine bump —
      # we track the supported 3.5.x patch line until that migration is scheduled.
      - dependency-name: "org.springframework.boot:*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: maven
    directory: /agentic-net-vault
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Spring Boot 4 / Framework 7 is a deliberate migration, not a routine bump —
      # we track the supported 3.5.x patch line until that migration is scheduled.
      - dependency-name: "org.springframework.boot:*"
        update-types: ["version-update:semver-major"]
      # spring-vault 4.x and springdoc 3.x target Spring Boot 4 — same migration gate.
      - dependency-name: "org.springframework.vault:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.springdoc:*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: maven
    directory: /sa-blobstore
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Spring Boot 4 / Framework 7 is a deliberate migration, not a routine bump —
      # we track the supported 3.5.x patch line until that migration is scheduled.
      - dependency-name: "org.springframework.boot:*"
        update-types: ["version-update:semver-major"]
      # hibernate-validator 9.x targets Jakarta EE 11 / Spring Boot 4.
      - dependency-name: "org.hibernate.validator:*"
        update-types: ["version-update:semver-major"]

  # TypeScript services — npm
  - package-ecosystem: npm
    directory: /agentic-net-cli
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 6 is blocked by Angular/tooling peer ranges (>=5.9 <6.0);
      # @types/node tracks the Node 22 runtime the services actually run on.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /agentic-net-chat
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
