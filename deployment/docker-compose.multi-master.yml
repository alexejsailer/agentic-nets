# Agentic-Nets — Multi-Master Topology (Docker Hub Only, No Monitoring)
#
# TWO masters + TWO executors behind one gateway, against a single node.
#
#   executor-1 ─┐                       ┌─> master-1 (models: MASTER_1_MODELS) ─┐
#               ├─poll──> gateway ──────┤                                        ├──> node
#   executor-2 ─┘   (routes by modelId) └─> master-2 (models: MASTER_2_MODELS) ─┘
#
# How it works:
#   * Each master self-registers with the gateway (`MASTER_GATEWAY_REGISTRATION=true`),
#     declaring which models it serves, and heartbeats every 15s. Registration is
#     retried until the gateway is reachable, and re-done automatically if the
#     gateway restarts — start order does not matter.
#   * The gateway runs WITHOUT a seed master (MASTER_URL is blank): routing comes
#     exclusively from the registry. `/api/transitions/poll?modelId=X` goes to the
#     master that declared X; `/api/transitions/discover` fans out to all masters.
#   * Masters partition by model: each only polls/fires transitions of models in
#     its own MASTER_N_MODELS scope (ActiveModelResolver intersection), so the two
#     schedulers never double-fire. Keep the two scopes DISJOINT. To route work to
#     master-2, create a model whose id is in MASTER_2_MODELS (default: default-2).
#   * Executors authenticate with the dedicated `agenticos-executor` OAuth2 client
#     (JWT scope-limited to the polling protocol). A command transition picks its
#     executor via the inscription's `action.executorId` (fallback assignedAgent;
#     "*" = any executor, first token reservation wins).
#
# Notes:
#   * The GUI still points at the default master port (8082 = master-1) for direct
#     calls; gateway-routed API calls reach both masters.
#   * This file is intended for staging validation of the multi-master + multi-
#     executor path — not (yet) the default production topology.
#
# Usage:
#   cd deployment
#   cp .env.template .env   # then edit .env with your settings
#   docker compose -f docker-compose.multi-master.yml up -d
#   docker compose -f docker-compose.multi-master.yml down

name: ${COMPOSE_PROJECT_NAME:-agenticnetos}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

volumes:
  blobstore-data:
  registry-data:
  openbao-data:
  ollama-data:

networks:
  agenticnetos-backend:
    name: ${COMPOSE_PROJECT_NAME:-agenticnetos}-backend
    driver: bridge
  agenticnetos-clients:
    name: ${COMPOSE_PROJECT_NAME:-agenticnetos}-clients
    driver: bridge

services:

  # ===========================================================================
  # INIT — prepare host bind-mount permissions (first-boot on Linux)
  # ===========================================================================

  init-perms:
    image: alpine:3.20
    container_name: ${COMPOSE_PROJECT_NAME:-agenticnetos}-init-perms
    command: ["sh", "-c", "mkdir -p /data/logs/node /data/logs/master-1 /data/logs/master-2 /data/logs/executor /data/logs/executor-2 /data/logs/vault /data/logs/gateway /data/logs/gui /data/logs/blobstore /data/gateway/jwt /node-data && (getent group agenticnet >/dev/null || addgroup -S agenticnet) && (getent passwd agenticnet >/dev/null || adduser -S -G agenticnet agenticnet) && chown -R agenticnet:agenticnet /data /node-data && chown -R 1001:1001 /data/logs/gui && chmod -R u=rwX,g=rwX,o= /data /node-data && chmod 700 /data/gateway /data/gateway/jwt"]
    volumes:
      - ./data:/data
      - ${AGENTICNETOS_NODE_DATA_DIR:-~/.agenticos}:/node-data
    restart: "no"

  # ===========================================================================
  # TOOL REGISTRY
  # ===========================================================================

  agenticnetos-registry:
    image: registry:2
    container_name: ${COMPOSE_PROJECT_NAME:-agenticnetos}-registry
    ports:
      - "${AGENTICNETOS_BIND_ADDRESS:-127.0.0.1}:${AGENTICNETOS_REGISTRY_PORT:-5001}:5000"
    volumes:
      - registry-data:/var/lib/registry
    networks:
      - agenticnetos-backend
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:5000/v2/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ===========================================================================
  # CORE BACKEND SERVICES
  # ===========================================================================

  agentic-net-node:
    image: alexejsailer/agenticnetos-node:${AGENTICNETOS_VERSION:-2.47.0}
    container_name: ${COMPOSE_PROJECT_NAME:-agenticnetos}-node
    depends_on:
      init-perms:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      AGENTICOS_CORS_ALLOWED_ORIGIN_PATTERNS: "${AGENTICOS_CORS_ALLOWED_ORIGIN_PATTERNS:-http://localhost:*,http://127.0.0.1:*}"
      AGENTICOS_EVENTPERSISTENCE_FILESYSTEM_BASEPATH: /app/data/events
      AGENTICOS_SNAPSHOT_STORE_FILESYSTEM_DIRECTORY: /app/data/snapshots
      AGENTICOS_PERSISTENCE_RECOVERY_MODELSBASEPATH: /app/data/models
      AGENTICOS_PERSISTENCE_RECOVERY_EVENTBASEPATH: /app/data/events
      AGENTICOS_PERSISTENCE_RECOVERY_SNAPSHOTBASEPATH: /app/data/snapshots
      LOG_PATH: /app/logs
      OTEL_SDK_DISABLED: "true"
    volumes:
      - ${AGENTICNETOS_NODE_DATA_DIR:-~/.agenticos}:/app/data
      - ./data/logs/node:/app/logs
    ports:
      - "${AGENTICNETOS_BIND_ADDRESS:-127.0.0.1}:${AGENTIC_NET_NODE_PORT:-8080}:8080"
    networks:
      - agenticnetos-backend
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: ${AGENTIC_NET_NODE_MEMORY_LIMIT:-2G}
          cpus: "${AGENTIC_NET_NODE_CPU_LIMIT:-1.0}"
        reservations:
          memory: 512M
          cpus: "0.25"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Master 1 — serves MASTER_1_MODELS (default: "default"). Self-registers with
  # the gateway and only polls/fires transitions of models inside its scope.
  agentic-net-master-1:
    image: alexejsailer/agenticnetos-master:${AGENTICNETOS_VERSION:-2.47.0}
    container_name: ${COMPOSE_PROJECT_NAME:-agenticnetos}-master-1
    depends_on:
      init-perms:
        condition: service_completed_successfully
      agentic-net-node:
        condition: service_healthy
      agentic-net-vault:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      MASTER_ID: master-1
      MASTER_MODELS: ${MASTER_1_MODELS:-default}
      TRANSITION_MASTER_MODELS: ${MASTER_1_MODELS:-default}
      MASTER_GATEWAY_REGISTRATION: "true"
      MASTER_GATEWAY_URL: http://agentic-net-gateway:8083
      MASTER_SELF_URL: http://agentic-net-master-1:8082
      AGENTIC_NET_NODE_BASE_URL: http://agentic-net-node:8080/api
      BLOBSTORE_BASE_URL: http://sa-blobstore:8080
      AGENTICOS_VAULT_URL: http://agentic-net-vault:8085
      AGENTICOS_CREDENTIALS_KEY: ${AGENTICOS_SETTINGS_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      AGENTICOS_MODEL_TIER: ${AGENTICOS_MODEL_TIER:-medium}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-glm-5.2:cloud}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_HIGH_MODEL: ${OPENAI_HIGH_MODEL:-gpt-5.4}
      OPENAI_MEDIUM_MODEL: ${OPENAI_MEDIUM_MODEL:-gpt-5.4-mini}
      OPENAI_LOW_MODEL: ${OPENAI_LOW_MODEL:-gpt-5.4-nano}
      AGENTICOS_REGISTRY_ENABLED: "${AGENTICOS_REGISTRY_ENABLED:-true}"
      AGENTICOS_REGISTRY_URL: "http://agenticnetos-registry:5000"
      AGENTICOS_REGISTRY_INTERNAL_URL: "http://agenticnetos-registry:5000"
      AGENTICOS_DOCKER_ENABLED: "${AGENTICOS_DOCKER_ENABLED:-true}"
      AGENTICOS_DOCKER_NETWORK: "${COMPOSE_PROJECT_NAME:-agenticnetos}-backend"
      AGENTICOS_DOCKER_REGISTRY_HOST: "localhost:${AGENTICNETOS_REGISTRY_PORT:-5001}"
      AGENTICOS_DOCKER_IMAGE_ALLOWLIST: "${AGENTICOS_DOCKER_IMAGE_ALLOWLIST:-localhost:5001/agenticos-*}"
      GATEWAY_INTERNAL_SECRET: "${GATEWAY_INTERNAL_SECRET:-agenticos-local-internal-secret-change-me}"
      AGENTICOS_CORS_ALLOWED_ORIGIN_PATTERNS: "${AGENTICOS_CORS_ALLOWED_ORIGIN_PATTERNS:-http://localhost:*,http://127.0.0.1:*}"
      LOG_PATH: /app/logs
      OTEL_SERVICE_NAME: agentic-net-master-1
      OTEL_SDK_DISABLED: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data/logs/master-1:/app/logs
    ports:
      - "${AGENTICNETOS_BIND_ADDRESS:-127.0.0.1}:${AGENTIC_NET_MASTER_PORT:-8082}:8082"
    networks:
      - agenticnetos-backend
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: ${AGENTIC_NET_MASTER_MEMORY_LIMIT:-2G}
          cpus: "${AGENTIC_NET_MASTER_CPU_LIMIT:-1.0}"
        reservations:
          memory: 512M
          cpus: "0.25"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8082/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Master 2 — serves MASTER_2_MODELS (default: "default-2"). Keep the scope
  # DISJOINT from master-1 or both schedulers will fire the shared models.
  agentic-net-master-2:
    image: alexejsailer/agenticnetos-master:${AGENTICNETOS_VERSION:-2.47.0}
    container_name: ${COMPOSE_PROJECT_NAME:-agenticnetos}-master-2
    depends_on:
      init-perms:
        condition: service_completed_successfully
      agentic-net-node:
        condition: service_healthy
      agentic-net-vault:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      MASTER_ID: master-2
      MASTER_MODELS: ${MASTER_2_MODELS:-default-2}
      TRANSITION_MASTER_MODELS: ${MASTER_2_MODELS:-default-2}
      MASTER_GATEWAY_REGISTRATION: "true"
      MASTER_GATEWAY_URL: http://agentic-net-gateway:8083
      MASTER_SELF_URL: http://agentic-net-master-2:8082
      AGENTIC_NET_NODE_BASE_URL: http://agentic-net-node:8080/api
      BLOBSTORE_BASE_URL: http://sa-blobstore:8080
      AGENTICOS_VAULT_URL: http://agentic-net-vault:8085
      AGENTICOS_CREDENTIALS_KEY: ${AGENTICOS_SETTINGS_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      AGENTICOS_MODEL_TIER: ${AGENTICOS_MODEL_TIER:-medium}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-glm-5.2:cloud}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_HIGH_MODEL: ${OPENAI_HIGH_MODEL:-gpt-5.4}
      OPENAI_MEDIUM_MODEL: ${OPENAI_MEDIUM_MODEL:-gpt-5.4-mini}
      OPENAI_LOW_MODEL: ${OPENAI_LOW_MODEL:-gpt-5.4-nano}
      AGENTICOS_REGISTRY_ENABLED: "${AGENTICOS_REGISTRY_ENABLED:-true}"
      AGENTICOS_REGISTRY_URL: "http://agenticnetos-registry:5000"
      AGENTICOS_REGISTRY_INTERNAL_URL: "http://agenticnetos-registry:5000"
      AGENTICOS_DOCKER_ENABLED: "${AGENTICOS_DOCKER_ENABLED:-true}"
      AGENTICOS_DOCKER_NETWORK: "${COMPOSE_PROJECT_NAME:-agenticnetos}-backend"
      AGENTICOS_DOCKER_REGISTRY_HOST: "localhost:${AGENTICNETOS_REGISTRY_PORT:-5001}"
      AGENTICOS_DOCKER_IMAGE_ALLOWLIST: "${AGENTICOS_DOCKER_IMAGE_ALLOWLIST:-localhost:5001/agenticos-*}"
      GATEWAY_INTERNAL_SECRET: "${GATEWAY_INTERNAL_SECRET:-agenticos-local-internal-secret-change-me}"
      AGENTICOS_CORS_ALLOWED_ORIGIN_PATTERNS: "${AGENTICOS_CORS_ALLOWED_ORIGIN_PATTERNS:-http://localhost:*,http://127.0.0.1:*}"
      LOG_PATH: /app/logs
      OTEL_SERVICE_NAME: agentic-net-master-2
      OTEL_SDK_DISABLED: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data/logs/master-2:/app/logs
    ports:
      - "${AGENTICNETOS_BIND_ADDRESS:-127.0.0.1}:${AGENTIC_NET_MASTER_2_PORT:-8087}:8082"
    networks:
      - agenticnetos-backend
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: ${AGENTIC_NET_MASTER_MEMORY_LIMIT:-2G}
          cpus: "${AGENTIC_NET_MASTER_CPU_LIMIT:-1.0}"
        reservations:
          memory: 512M
          cpus: "0.25"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8082/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ===========================================================================
  # EXECUTORS — both poll through the gateway with the executor OAuth2 client
  # ===========================================================================

  agentic-net-executor:
    image: alexejsailer/agenticnetos-executor:${AGENTICNETOS_VERSION:-2.47.0}
    container_name: ${COMPOSE_PROJECT_NAME:-agenticnetos}-executor
    depends_on:
      init-perms:
        condition: service_completed_successfully
      agentic-net-gateway:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      EXECUTOR_UPSTREAM_URL: http://agentic-net-gateway:8083
      EXECUTOR_ID: ${EXECUTOR_ID:-agentic-net-executor-default}
      EXECUTOR_MODELS: "${EXECUTOR_MODELS:-*}"
      EXECUTOR_AUTH_CLIENT_ID: ${AGENTICOS_EXECUTOR_CLIENT_ID:-agenticos-executor}
      EXECUTOR_AUTH_CLIENT_SECRET: ${AGENTICOS_EXECUTOR_SECRET:-}
      EXECUTOR_AUTH_CLIENT_SECRET_FILE: /app/gateway-data/jwt/executor-secret
      AGENTIC_NET_NODE_BASE_URL: http://agentic-net-node:8080/api
      # Blobstore for large-output offload + binaryUrn uploads. Without this the
      # executor falls back to localhost:8095 (nothing listens there in a container),
      # so a >128KB stdout was silently truncated instead of offloaded.
      BLOBSTORE_HOST: http://sa-blobstore:8080
      LOG_PATH: /app/logs
      AGENTICOS_CORS_ALLOWED_ORIGIN_PATTERNS: "${AGENTICOS_CORS_ALLOWED_ORIGIN_PATTERNS:-http://localhost:*,http://127.0.0.1:*}"
      AGENTICOS_CREDENTIALS_KEY: ${AGENTICOS_SETTINGS_KEY:-}
      OTEL_SERVICE_NAME: agentic-net-executor
      OTEL_SDK_DISABLED: "true"
    volumes:
      - ./data/logs/executor:/app/logs
      - ./data/gateway/jwt:/app/gateway-data/jwt:ro
    ports:
      - "${AGENTICNETOS_BIND_ADDRESS:-127.0.0.1}:${AGENTIC_NET_EXECUTOR_PORT:-8084}:8084"
    networks:
      - agenticnetos-backend
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: ${AGENTIC_NET_EXECUTOR_MEMORY_LIMIT:-1G}
          cpus: "${AGENTIC_NET_EXECUTOR_CPU_LIMIT:-0.75}"
        reservations:
          memory: 256M
          cpus: "0.25"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8084/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  agentic-net-executor-2:
    image: alexejsailer/agenticnetos-executor:${AGENTICNETOS_VERSION:-2.47.0}
    container_name: ${COMPOSE_PROJECT_NAME:-agenticnetos}-executor-2
    depends_on:
      init-perms:
        condition: service_completed_successfully
      agentic-net-gateway:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      EXECUTOR_UPSTREAM_URL: http://agentic-net-gateway:8083
      EXECUTOR_ID: ${EXECUTOR_2_ID:-agentic-net-executor-2}
      EXECUTOR_MODELS: "${EXECUTOR_2_MODELS:-*}"
      EXECUTOR_AUTH_CLIENT_ID: ${AGENTICOS_EXECUTOR_CLIENT_ID:-agenticos-executor}
      EXECUTOR_AUTH_CLIENT_SECRET: ${AGENTICOS_EXECUTOR_SECRET:-}
      EXECUTOR_AUTH_CLIENT_SECRET_FILE: /app/gateway-data/jwt/executor-secret
      AGENTIC_NET_NODE_BASE_URL: http://agentic-net-node:8080/api
      # Blobstore for large-output offload + binaryUrn uploads. Without this the
      # executor falls back to localhost:8095 (nothing listens there in a container),
      # so a >128KB stdout was silently truncated instead of offloaded.
      BLOBSTORE_HOST: http://sa-blobstore:8080
      LOG_PATH: /app/logs
      AGENTICOS_CORS_ALLOWED_ORIGIN_PATTERNS: "${AGENTICOS_CORS_ALLOWED_ORIGIN_PATTERNS:-http://localhost:*,http://127.0.0.1:*}"
      AGENTICOS_CREDENTIALS_KEY: ${AGENTICOS_SETTINGS_KEY:-}
      OTEL_SERVICE_NAME: agentic-net-executor-2
      OTEL_SDK_DISABLED: "true"
    volumes:
      - ./data/logs/executor-2:/app/logs
      - ./data/gateway/jwt:/app/gateway-data/jwt:ro
    ports:
      - "${AGENTICNETOS_BIND_ADDRESS:-127.0.0.1}:${AGENTIC_NET_EXECUTOR_2_PORT:-8086}:8084"
    networks:
      - agenticnetos-backend
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: ${AGENTIC_NET_EXECUTOR_MEMORY_LIMIT:-1G}
          cpus: "${AGENTIC_NET_EXECUTOR_CPU_LIMIT:-0.75}"
        reservations:
          memory: 256M
          cpus: "0.25"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8084/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ===========================================================================
  # LLM RUNTIME
  # ===========================================================================

  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.21.0}
    container_name: ${COMPOSE_PROJECT_NAME:-agenticnetos}-ollama
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - agenticnetos-backend
      - agenticnetos-clients
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: ${OLLAMA_MEMORY_LIMIT:-8G}
          cpus: "${OLLAMA_CPU_LIMIT:-2.0}"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ===========================================================================
  # SECRETS MANAGEMENT
  # ===========================================================================

  openbao:
    image: quay.io/openbao/openbao:2.1.0
    container_name: ${COMPOSE_PROJECT_NAME:-agenticnetos}-openbao
    command: ["server", "-dev", "-dev-root-token-id=${OPENBAO_DEV_ROOT_TOKEN:-agenticos-dev-token}"]
    environment:
      BAO_ADDR: "http://0.0.0.0:8200"
    volumes:
      - openbao-data:/openbao/data
    networks:
      - agenticnetos-backend
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "bao", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  agentic-net-vault:
    image: alexejsailer/agenticnetos-vault:${AGENTICNETOS_VERSION:-2.47.0}
    container_name: ${COMPOSE_PROJECT_NAME:-agenticnetos}-vault
    depends_on:
      init-perms:
        condition: service_completed_successfully
      openbao:
        condition: service_healthy
    environment:
      # Connection/thread ceilings so an upstream storm cannot translate into unbounded threads.
      # Set here as well as in the vault's application.properties so a deployment running an older
      # published image still gets the ceiling (Spring binds these standard env names natively).
      # See the vault's application.properties for the sizing rationale.
      SERVER_TOMCAT_THREADS_MAX: "${VAULT_TOMCAT_THREADS_MAX:-25}"
      SERVER_TOMCAT_MAX_CONNECTIONS: "${VAULT_TOMCAT_MAX_CONNECTIONS:-100}"
      SERVER_TOMCAT_ACCEPT_COUNT: "${VAULT_TOMCAT_ACCEPT_COUNT:-50}"
      # Keep half the cgroup available for metaspace, code cache, direct buffers and native thread
      # stacks. The observed restart loop was driven by an upstream credential-read storm and
      # Tomcat worker/native RSS, not by the heap reaching its 75% ceiling; the lower heap ratio is
      # defensive headroom alongside the client-side lazy cache and the Tomcat ceilings above.
      JAVA_OPTS: "-XX:MaxRAMPercentage=50.0 -XX:+UseG1GC -XX:+UseContainerSupport"
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      VAULT_OPENBAO_URL: http://openbao:8200
      VAULT_OPENBAO_TOKEN: ${OPENBAO_DEV_ROOT_TOKEN:-agenticos-dev-token}
      LOG_PATH: /app/logs
      AGENTICOS_CORS_ALLOWED_ORIGIN_PATTERNS: "${AGENTICOS_CORS_ALLOWED_ORIGIN_PATTERNS:-http://localhost:*,http://127.0.0.1:*}"
      OTEL_SDK_DISABLED: "true"
    volumes:
      - ./data/logs/vault:/app/logs
    ports:
      - "${AGENTICNETOS_BIND_ADDRESS:-127.0.0.1}:${AGENTIC_NET_VAULT_PORT:-8085}:8085"
    networks:
      - agenticnetos-backend
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: ${AGENTIC_NET_VAULT_MEMORY_LIMIT:-1G}
          cpus: "${AGENTIC_NET_VAULT_CPU_LIMIT:-0.5}"
        reservations:
          memory: 128M
          cpus: "0.1"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8085/api/health/ping || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ===========================================================================
  # API GATEWAY — no seed master; masters self-register at runtime
  # ===========================================================================

  agentic-net-gateway:
    image: alexejsailer/agenticnetos-gateway:${AGENTICNETOS_VERSION:-2.47.0}
    container_name: ${COMPOSE_PROJECT_NAME:-agenticnetos}-gateway
    depends_on:
      init-perms:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      # Blank on purpose: with no seed master, routing comes exclusively from
      # the /internal/masters registry the two masters register into.
      MASTER_URL: ""
      NODE_URL: http://agentic-net-node:8080
      VAULT_URL: http://agentic-net-vault:8085
      GATEWAY_TIMEOUT: ${GATEWAY_TIMEOUT:-30}
      GATEWAY_PROXY_TIMEOUT: ${GATEWAY_PROXY_TIMEOUT:-300}
      AGENTICOS_ADMIN_SECRET: ${AGENTICOS_ADMIN_SECRET:-}
      AGENTICOS_EXECUTOR_SECRET: ${AGENTICOS_EXECUTOR_SECRET:-}
      GATEWAY_INTERNAL_SECRET: "${GATEWAY_INTERNAL_SECRET:-agenticos-local-internal-secret-change-me}"
      GATEWAY_CORS_ALLOWED_ORIGIN_PATTERNS: "${GATEWAY_CORS_ALLOWED_ORIGIN_PATTERNS:-http://localhost:*,http://127.0.0.1:*}"
      GATEWAY_JWT_KEY_DIR: /app/data/jwt
      LOG_PATH: /app/logs
      OTEL_SDK_DISABLED: "true"
    ports:
      - "${AGENTICNETOS_BIND_ADDRESS:-127.0.0.1}:${AGENTIC_NET_GATEWAY_PORT:-8083}:8083"
    volumes:
      - ./data/gateway:/app/data
      - ./data/logs/gateway:/app/logs
    networks:
      - agenticnetos-backend
      - agenticnetos-clients
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: ${AGENTIC_NET_GATEWAY_MEMORY_LIMIT:-1G}
          cpus: "${AGENTIC_NET_GATEWAY_CPU_LIMIT:-0.75}"
        reservations:
          memory: 256M
          cpus: "0.25"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/api/health/ping || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ===========================================================================
  # CLIENT SERVICES
  # ===========================================================================

  agentic-net-gui:
    image: alexejsailer/agenticnetos-gui:${AGENTICNETOS_VERSION:-2.47.0}
    container_name: ${COMPOSE_PROJECT_NAME:-agenticnetos}-gui
    depends_on:
      init-perms:
        condition: service_completed_successfully
      agentic-net-gateway:
        condition: service_healthy
    ports:
      - "${AGENTICNETOS_BIND_ADDRESS:-127.0.0.1}:${AGENTIC_NET_GUI_PORT:-4200}:4200"
    volumes:
      - ./data/logs/gui:/app/logs
    networks:
      - agenticnetos-clients
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 128M
          cpus: "0.1"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4200/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ===========================================================================
  # BLOB STORAGE
  # ===========================================================================

  sa-blobstore:
    image: alexejsailer/agenticnetos-blobstore:${AGENTICNETOS_VERSION:-2.47.0}
    container_name: ${COMPOSE_PROJECT_NAME:-agenticnetos}-blobstore
    depends_on:
      init-perms:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      LOG_PATH: /app/logs
      OTEL_SDK_DISABLED: "true"
    ports:
      - "${AGENTICNETOS_BIND_ADDRESS:-127.0.0.1}:${SA_BLOBSTORE_PORT:-8090}:8080"
    volumes:
      - ./data/logs/blobstore:/app/logs
      # Blob payloads live here (STORAGE_PATH=/app/data), sharded XX/YY/ZZ by the
      # sha256 of the blob id. MUST be a persistent volume or every blob — including
      # durable tool-catalog script artifacts — is lost on container recreation.
      - blobstore-data:/app/data
    networks:
      - agenticnetos-backend
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "0.75"
        reservations:
          memory: 256M
          cpus: "0.25"
    healthcheck:
      # blobstore exposes actuator on the management port (9090), not 8080 (API).
      test: ["CMD-SHELL", "curl -f http://localhost:9090/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
